[project]
name = "asfo"
version = "0.1.0"
description = "Adaptive Semantic Federated Optimization for Cross-Domain Intrusion Detection using Knowledge Graph-Guided Threat Intelligence"
authors = [
    { name = "ASFO Contributors" }
]
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "torch>=2.3.1",
    "torchvision>=0.18.1",
    "mlflow>=2.14.0",
    "pydantic>=2.7.4",
    "pydantic-settings>=2.3.4",
    "hydra-core>=1.3.2",
    "loguru>=0.7.2",
    "sentence-transformers>=3.0.1",
    "transformers>=4.41.2",
    "networkx>=3.3",
    "faiss-cpu>=1.8.0",
    "langchain>=0.2.6",
    "psycopg2-binary>=2.9.9",
    "redis>=5.0.7",
    "shap>=0.46.0",
    "pandas>=2.2.2",
    "numpy>=1.26.4",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "plotly>=5.22.0",
    "dvc>=3.0.0",
    "ydata-profiling>=4.0.0",
    "setuptools",
    "tensorboard>=2.17.0",
    "flwr==1.36.0",
    "ray>=2.56.1",
    "kaggle>=2.2.3",
]
readme = "README.md"
requires-python = "==3.12.*"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "black>=24.4.2",
    "ruff>=0.5.0",
    "mypy>=1.10.1",
    "mkdocs-material>=9.5.27",
    "pre-commit>=3.7.1",
    "hypothesis>=6.0.0",
]

[tool.black]
line-length = 88
target-version = ['py312']

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml"
testpaths = [
    "tests",
]
