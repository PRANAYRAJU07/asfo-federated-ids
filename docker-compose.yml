

x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgresql:
    image: postgres:17
    container_name: asfo-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-asfo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-asfo_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-asfo_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-asfo_user} -d ${POSTGRES_DB:-asfo_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asfo_network
    logging: *common-logging

  redis:
    image: redis:8
    container_name: asfo-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - asfo_network
    logging: *common-logging

  mlflow:
    image: python:3.12-slim
    container_name: asfo-mlflow
    restart: always
    command: >
      bash -c "pip install mlflow psycopg2-binary boto3 &&
      mlflow server
      --backend-store-uri postgresql://${POSTGRES_USER:-asfo_user}:${POSTGRES_PASSWORD:-asfo_secure_password}@postgresql:5432/${POSTGRES_DB:-asfo_db}
      --default-artifact-root /mlflow/artifacts
      --host 0.0.0.0 --port 5000"
    ports:
      - "5000:5000"
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - mlflow_data:/mlflow/artifacts
    networks:
      - asfo_network
    logging: *common-logging
    profiles: ["full"]

  ollama:
    image: ollama/ollama:latest
    container_name: asfo-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - asfo_network
    logging: *common-logging
    profiles: ["full"]

  kg-service:
    build:
      context: .
      dockerfile: docker/kg-service.Dockerfile
    container_name: asfo-kg-service
    restart: always
    depends_on:
      - ollama
      - redis
    networks:
      - asfo_network
    logging: *common-logging
    profiles: ["full"]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: asfo-api
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - asfo_network
    logging: *common-logging

  flower-server:
    build:
      context: .
      dockerfile: docker/flower-server.Dockerfile
    container_name: asfo-flower-server
    restart: always
    ports:
      - "8080:8080"
    networks:
      - asfo_network
    logging: *common-logging

  flower-client-1:
    build:
      context: .
      dockerfile: docker/flower-client.Dockerfile
    container_name: asfo-flower-client-1
    restart: always
    depends_on:
      - flower-server
    environment:
      - FLOWER_SERVER_ADDRESS=flower-server:8080
      - CLIENT_ID=1
    networks:
      - asfo_network
    logging: *common-logging

  flower-client-2:
    build:
      context: .
      dockerfile: docker/flower-client.Dockerfile
    container_name: asfo-flower-client-2
    restart: always
    depends_on:
      - flower-server
    environment:
      - FLOWER_SERVER_ADDRESS=flower-server:8080
      - CLIENT_ID=2
    networks:
      - asfo_network
    logging: *common-logging

  flower-client-3:
    build:
      context: .
      dockerfile: docker/flower-client.Dockerfile
    container_name: asfo-flower-client-3
    restart: always
    depends_on:
      - flower-server
    environment:
      - FLOWER_SERVER_ADDRESS=flower-server:8080
      - CLIENT_ID=3
    networks:
      - asfo_network
    logging: *common-logging

  jupyter:
    image: jupyter/scipy-notebook:latest
    container_name: asfo-jupyter
    restart: always
    ports:
      - "8888:8888"
    volumes:
      - .:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
    networks:
      - asfo_network
    logging: *common-logging
    profiles: ["full"]

networks:
  asfo_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  mlflow_data:
  ollama_data:
